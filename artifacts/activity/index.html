<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no"
    />
    <title>DN Cards — Live</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8F%B0%3C/text%3E%3C/svg%3E"
    />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #0b0f1a;
        color: #e6ecff;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      }
      #game {
        width: 100vw;
        height: 100vh;
        /* The game owns every touch gesture — stop the browser from panning,
           pinch-zooming the page, or firing 300ms tap delays. */
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
        overscroll-behavior: none;
      }
      #game canvas {
        touch-action: none;
        display: block;
      }
      /* Pre-Phaser boot splash so the iframe is never a blank white flash. */
      #boot {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        gap: 12px;
      }
      #boot .spark {
        width: 42px;
        height: 42px;
        border-radius: 50%;
        border: 3px solid rgba(90, 140, 255, 0.25);
        border-top-color: #5a8cff;
        animation: spin 0.9s linear infinite;
      }
      #boot small {
        opacity: 0.6;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        font-size: 11px;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div id="boot"><div class="spark"></div><small>Loading DN Cards…</small></div>
    <div id="game"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
