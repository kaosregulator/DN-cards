kind = "api"
previewPath = "/api" # TODO - should be excluded from preview in the first place
title = "API Server"
version = "1.0.0"
id = "3B4_FFSkEVBkAeYMFRJ2e"

[[services]]
localPort = 8080
name = "API Server"
paths = ["/api"]

[services.development]
run = "pnpm --filter @workspace/api-server run dev"

[services.production]

[services.production.build]
args = ["pnpm", "--filter", "@workspace/api-server", "run", "build"]

[services.production.build.env]
NODE_ENV = "production"

[services.production.run]
# we don't run through pnpm to make startup faster in production
args = ["node", "--enable-source-maps", "artifacts/api-server/dist/index.mjs"]

[services.production.run.env]
PORT = "8080"
NODE_ENV = "production"

[services.production.health.startup]
path = "/api/healthz"

# DISCORD_CLIENT_ID / DISCORD_CLIENT_SECRET are provided directly as Replit
# Secrets and injected into the process by name — exactly like DISCORD_BOT_TOKEN
# and HOME_GUILD_ID. They must NOT be re-declared here as "${...}" templates:
# when the deploy doesn't substitute the template, the process receives the
# literal "${DISCORD_CLIENT_SECRET}" string, which the server correctly treats
# as unset (→ "Activity backend is not configured"). Leaving them out lets the
# real Secret values flow through.